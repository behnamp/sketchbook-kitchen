name: Daily Instagram post
on:
  schedule:
    - cron: "0 22 * * *"        # 22:00 UTC = 6 pm Toronto in summer time, 5 pm in winter
  workflow_dispatch:
    inputs:
      date:
        description: "Post the entry for this date instead (YYYY-MM-DD)"
        required: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python post_instagram.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          POST_DATE: ${{ github.event.inputs.date }}
