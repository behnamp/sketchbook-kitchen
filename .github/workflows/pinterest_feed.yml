name: Daily Pinterest feed
on:
  schedule:
    - cron: "0 21 * * *"        # 21:00 UTC, before the evening posting time in Toronto
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_feed.py
      - name: Commit the updated feed
        run: |
          git config user.name "sketchbook-bot"
          git config user.email "sketchbook-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet && echo "feed unchanged" && exit 0
          git commit -m "Daily Pinterest feed $(date +%F)"
          git push
          # make sure GitHub Pages republishes after a commit made by this job
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds > /dev/null || true
